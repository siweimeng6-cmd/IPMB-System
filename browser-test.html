<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>浏览器测试页</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
        background: radial-gradient(circle at top, #194c75, #081321 65%);
      }
      main {
        width: min(560px, calc(100% - 32px));
        padding: 42px;
        border: 1px solid #4ec9ff66;
        border-radius: 20px;
        background: #0e2036cc;
        box-shadow: 0 24px 70px #0008;
        text-align: center;
      }
      .icon { font-size: 52px; }
      h1 { margin: 14px 0 10px; color: #75d6ff; }
      p { margin: 0; color: #d3e6f5; line-height: 1.8; }
      button {
        margin-top: 26px;
        padding: 11px 20px;
        border: 0;
        border-radius: 10px;
        color: #052037;
        background: #75d6ff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #status { margin-top: 16px; color: #9de4b2; min-height: 1.8em; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">✅</div>
      <h1>浏览器测试成功</h1>
      <p>如果你能看到此页面，说明 HTML 文件已被浏览器正常打开。</p>
      <button id="testButton">点我测试 JavaScript</button>
      <div id="status"></div>
    </main>
    <script>
      document.getElementById('testButton').addEventListener('click', () => {
        document.getElementById('status').textContent = 'JavaScript 也运行正常！';
      });
    </script>
  </body>
</html>
